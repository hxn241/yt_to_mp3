[project]
name = "telegram-youtube-mp3-bot"
version = "1.0.0"
description = "Bot de Telegram para descargar música de YouTube en formato MP3"
requires-python = ">=3.8"
dependencies = [
    "python-telegram-bot>=20.7",
    "yt-dlp>=2024.7.25",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
